name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Report versions
        run: node --version && ffmpeg -version | head -n 1
      - name: Test
        run: npm test
      - name: Smoke render both presets
        run: |
          node src/cli.js presets
          node src/cli.js form --preset galactic --duration 60
          node src/cli.js generate --preset galactic --duration 20 --out /tmp/galactic.mp3
          node src/cli.js generate --preset dark-fantasy --duration 20 --out /tmp/dark-fantasy.mp3 --json
      - name: Upload smoke renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-renders-node${{ matrix.node }}
          path: /tmp/*.mp3
          if-no-files-found: ignore
